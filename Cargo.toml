[workspace]
resolver = "3"
members = [
    "crates/truesight-core",
    "crates/truesight-adapters",
    "crates/truesight-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["kozz36"]

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

