name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUSTUP_TOOLCHAIN: stable

jobs:
  release-linux-x86_64:
    name: Build & Publish Linux x86_64 Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux GUI system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libxkbcommon-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libwayland-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libgtk-3-dev

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Verify formatting, clippy, and dual-feature test matrix
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked
          cargo test --workspace --no-default-features --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package binary and SHA256 checksums
        run: |
          mkdir -p dist
          install -m 755 target/release/truesight-dota dist/truesight-dota
          cp LICENSE README.md dist/
          tar -C dist -czf truesight-dota-linux-x86_64.tar.gz truesight-dota LICENSE README.md
          sha256sum truesight-dota-linux-x86_64.tar.gz > SHA256SUMS

      - name: Upload GitHub Release assets
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            truesight-dota-linux-x86_64.tar.gz
            SHA256SUMS
