name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUSTUP_TOOLCHAIN: stable

jobs:
  release-linux-x86_64:
    name: Build Linux x86_64 Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux GUI system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libxkbcommon-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libwayland-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libgtk-3-dev

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Verify formatting, clippy, and dual-feature test matrix
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked
          cargo test --workspace --no-default-features --locked

      - name: Build and smoke-check release binary
        run: |
          cargo build --release --locked
          ./target/release/truesight-dota --demo --no-color | grep -q "WIN PROBABILITY"

      - name: Package Linux tarball
        run: |
          mkdir -p dist-linux stage-linux
          install -m 755 target/release/truesight-dota stage-linux/truesight-dota
          install -m 755 packaging/linux/install-desktop.sh stage-linux/install-desktop.sh
          cp packaging/gamestate_integration_truesight.cfg \
            packaging/linux/truesight-dota.desktop \
            packaging/icons/truesight-dota.png \
            LICENSE README.md stage-linux/
          tar -C stage-linux -czf dist-linux/truesight-dota-linux-x86_64.tar.gz \
            truesight-dota gamestate_integration_truesight.cfg \
            truesight-dota.desktop install-desktop.sh truesight-dota.png \
            LICENSE README.md

      - name: Upload Linux release artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-x86_64
          path: dist-linux/truesight-dota-linux-x86_64.tar.gz

  release-windows-x86_64:
    name: Build Windows x86_64 Release & MSI
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Verify clippy and dual-feature tests on Windows
        run: |
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked
          cargo test --workspace --no-default-features --locked

      - name: Build and smoke-check Windows release binary
        shell: pwsh
        run: |
          cargo build --release --locked
          $out = & .\target\release\truesight-dota.exe --demo --no-color
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $text = $out -join "`n"
          if (-not ($text -match "TRUESIGHT-DOTA" -and $text -match "WIN PROBABILITY")) {
            Write-Error "Unexpected --demo output on Windows release binary:`n$text"
            exit 1
          }

      - name: Install WiX CLI
        shell: pwsh
        run: dotnet tool install --global wix --version 5.0.2

      - name: Package Windows ZIP and MSI installer
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          .\packaging\windows\build-release-packages.ps1 `
            -ExePath ".\target\release\truesight-dota.exe" `
            -GuiExePath ".\target\release\truesight-dota-gui.exe" `
            -Version $env:RELEASE_TAG `
            -OutDir ".\dist-windows"

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-x86_64
          path: |
            dist-windows/truesight-dota-windows-x86_64.msi
            dist-windows/truesight-dota-windows-x86_64.zip

  publish-release:
    name: Generate Unified SHA256SUMS & Publish Release
    permissions:
      contents: write
    needs:
      - release-linux-x86_64
      - release-windows-x86_64
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate unified SHA256SUMS
        run: |
          cd release-artifacts
          sha256sum \
            truesight-dota-linux-x86_64.tar.gz \
            truesight-dota-windows-x86_64.msi \
            truesight-dota-windows-x86_64.zip \
            > SHA256SUMS
          cat SHA256SUMS

      - name: Upload GitHub Release assets
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            release-artifacts/truesight-dota-linux-x86_64.tar.gz
            release-artifacts/truesight-dota-windows-x86_64.msi
            release-artifacts/truesight-dota-windows-x86_64.zip
            release-artifacts/SHA256SUMS
