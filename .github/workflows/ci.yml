name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUSTDOCFLAGS: "-D warnings"
  RUSTUP_TOOLCHAIN: stable

jobs:
  lint:
    name: Format, Clippy & Rustdoc (Ubuntu x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux GUI system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libxkbcommon-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libwayland-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libgtk-3-dev

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run Clippy (headless CLI)
        run: cargo clippy --workspace --all-targets --no-default-features --locked -- -D warnings

      - name: Check Rustdoc links & warnings
        run: cargo doc --workspace --no-deps --document-private-items --locked

  test-ubuntu:
    name: Dual-Feature Test Matrix (Ubuntu x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux GUI system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libxkbcommon-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libwayland-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libgtk-3-dev

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run full workspace tests (GUI + CLI)
        run: cargo test --workspace --all-features --locked

      - name: Run headless workspace tests (CLI zero-GUI)
        run: cargo test --workspace --no-default-features --locked

  test-windows:
    name: Windows x86_64 Smoke Compile & Tests
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run Clippy on Windows (all features)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run full workspace tests on Windows (GUI + CLI)
        run: cargo test --workspace --all-features --locked

      - name: Run headless workspace tests on Windows (CLI zero-GUI)
        run: cargo test --workspace --no-default-features --locked

      - name: Smoke-test Windows release CLI console output
        shell: pwsh
        run: |
          cargo build --release --locked
          $out = & .\target\release\truesight-dota.exe --demo --no-color
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $text = $out -join "`n"
          if (-not ($text -match "TRUESIGHT-DOTA" -and $text -match "WIN PROBABILITY")) {
            Write-Error "Unexpected --demo output on Windows release binary:`n$text"
            exit 1
          }

      - name: Smoke-test Windows GSI installer & MSI/ZIP packaging
        shell: pwsh
        run: |
          $tmpDota = Join-Path $env:RUNNER_TEMP "ts_gsi_smoke"
          New-Item -ItemType Directory -Path (Join-Path $tmpDota "game\dota\cfg") -Force | Out-Null
          .\packaging\windows\install-gsi.ps1 -DotaDir $tmpDota
          $installedCfg = Join-Path $tmpDota "game\dota\cfg\gamestate_integration\gamestate_integration_truesight.cfg"
          if (-not (Test-Path -LiteralPath $installedCfg)) {
            Write-Error "install-gsi.ps1 did not create $installedCfg"
            exit 1
          }
          dotnet tool install --global wix --version 5.0.2
          $pkgOut = Join-Path $env:RUNNER_TEMP "ts_pkg_out"
          .\packaging\windows\build-release-packages.ps1 `
            -ExePath ".\target\release\truesight-dota.exe" `
            -GuiExePath ".\target\release\truesight-dota-gui.exe" `
            -Version "0.1.0" `
            -OutDir $pkgOut
          $msiV1 = Join-Path $pkgOut "truesight-dota-windows-x86_64.msi"
          $zipV1 = Join-Path $pkgOut "truesight-dota-windows-x86_64.zip"
          if (-not (Test-Path -LiteralPath $msiV1) -or -not (Test-Path -LiteralPath $zipV1)) {
            Write-Error "Missing expected Windows release package output in $pkgOut"
            exit 1
          }

          function Invoke-MsiExec {
            param([string[]]$MsiArgs, [string]$LogPath)
            $p = Start-Process -FilePath "msiexec.exe" -ArgumentList $MsiArgs -Wait -PassThru -NoNewWindow
            if ($p.ExitCode -ne 0) {
              if (Test-Path -LiteralPath $LogPath) {
                Get-Content -LiteralPath $LogPath -Tail 80
              }
              throw "msiexec failed with exit code $($p.ExitCode)"
            }
          }

          $installDir = Join-Path $env:LOCALAPPDATA "Programs\TrueSight Dota"
          $shortcutPath = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\TrueSight Dota\TrueSight Dota.lnk"
          $installLog = Join-Path $env:RUNNER_TEMP "msi_install.log"
          Invoke-MsiExec -MsiArgs @("/i", "`"$msiV1`"", "/qn", "/norestart", "/l*v", "`"$installLog`"") -LogPath $installLog

          foreach ($rel in @("truesight-dota.exe", "truesight-dota-gui.exe", "gamestate_integration_truesight.cfg", "install-gsi.ps1", "LICENSE", "README.md")) {
            $p = Join-Path $installDir $rel
            if (-not (Test-Path -LiteralPath $p)) {
              throw "MSI install missing expected payload file: $p"
            }
          }
          if (-not (Test-Path -LiteralPath $shortcutPath)) {
            throw "MSI install missing Start Menu shortcut: $shortcutPath"
          }
          function Get-PeSubsystem {
            param([string]$Path)
            $bytes = [System.IO.File]::ReadAllBytes($Path)
            $peOffset = [System.BitConverter]::ToInt32($bytes, 0x3C)
            return [System.BitConverter]::ToUInt16($bytes, $peOffset + 24 + 68)
          }
          $cliSubsystem = Get-PeSubsystem (Join-Path $installDir "truesight-dota.exe")
          $guiSubsystem = Get-PeSubsystem (Join-Path $installDir "truesight-dota-gui.exe")
          if ($cliSubsystem -ne 3) {
            throw "Expected truesight-dota.exe to use Windows CUI subsystem (3), got $cliSubsystem"
          }
          if ($guiSubsystem -ne 2) {
            throw "Expected truesight-dota-gui.exe to use Windows GUI subsystem (2), got $guiSubsystem"
          }
          $shell = New-Object -ComObject WScript.Shell
          $shortcutTarget = $shell.CreateShortcut($shortcutPath).TargetPath
          if (-not $shortcutTarget.EndsWith("\truesight-dota-gui.exe", [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "Expected Start Menu shortcut to target truesight-dota-gui.exe, got: $shortcutTarget"
          }
          $installedOut = & (Join-Path $installDir "truesight-dota.exe") --demo --no-color
          if ($LASTEXITCODE -ne 0 -or -not (($installedOut -join "`n") -match "WIN PROBABILITY")) {
            throw "Installed truesight-dota.exe failed --demo smoke test"
          }

          $pkgUpgradeOut = Join-Path $env:RUNNER_TEMP "ts_pkg_upgrade"
          .\packaging\windows\build-release-packages.ps1 `
            -ExePath ".\target\release\truesight-dota.exe" `
            -GuiExePath ".\target\release\truesight-dota-gui.exe" `
            -Version "0.1.1" `
            -OutDir $pkgUpgradeOut
          $msiV2 = Join-Path $pkgUpgradeOut "truesight-dota-windows-x86_64.msi"
          $upgradeLog = Join-Path $env:RUNNER_TEMP "msi_upgrade.log"
          Invoke-MsiExec -MsiArgs @("/i", "`"$msiV2`"", "/qn", "/norestart", "/l*v", "`"$upgradeLog`"") -LogPath $upgradeLog
          if (-not (Test-Path -LiteralPath (Join-Path $installDir "truesight-dota.exe"))) {
            throw "MSI upgrade removed installed executable"
          }

          $uninstallLog = Join-Path $env:RUNNER_TEMP "msi_uninstall.log"
          Invoke-MsiExec -MsiArgs @("/x", "`"$msiV2`"", "/qn", "/norestart", "/l*v", "`"$uninstallLog`"") -LogPath $uninstallLog
          if (Test-Path -LiteralPath $installDir) {
            throw "MSI uninstall left behind install directory: $installDir"
          }
          if (Test-Path -LiteralPath $shortcutPath) {
            throw "MSI uninstall left behind Start Menu shortcut: $shortcutPath"
          }
