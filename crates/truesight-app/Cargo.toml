[package]
name = "truesight-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Native 5v5 draft analyzer and recommender for Dota 2"
default-run = "truesight-dota"

[[bin]]
name = "truesight-dota"
path = "src/main.rs"

[[bin]]
name = "truesight-dota-gui"
path = "src/bin/truesight-dota-gui.rs"
required-features = ["gui"]

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:global-hotkey", "dep:zbus"]

[dependencies]
truesight-core = { path = "../truesight-core" }
truesight-adapters = { path = "../truesight-adapters" }
eframe = { version = "0.31", optional = true }
global-hotkey = { version = "0.7", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "4", optional = true }

[lints]
workspace = true
