# Curated Dota 2 counter-trait mappings for pure item-build recommendations.
# Update `patch` and `reviewed_at` whenever reviewing hero/item traits for a new Dota 2 patch.

patch = "7.40"
reviewed_at = "2026-11-21"

[traits]
# Monkey King Bar (135)
evasion = [135]
# Black King Bar (116), Pipe of Insight (90), Lotus Orb (226)
heavy_magic_disable = [116, 90, 226]
# Spirit Vessel (267), Shiva's Guard (119), Eye of Skadi (160)
high_healing_regen = [267, 119, 160]
# Bloodthorn (250), Nullifier (225)
ethereal_ghost_save = [250, 225]
# Silver Edge (249)
critical_passives = [249]
# Mjollnir (158), Battle Fury (145), Shiva's Guard (119)
illusions_summons = [158, 145, 119]
# Dust of Appearance (40), Gem of True Sight (30), Sentry Ward (43)
invisibility = [40, 30, 43]
# Assault Cuirass (112), Shiva's Guard (119), Crimson Guard (242), Heaven's Halberd (210)
high_physical_burst = [112, 119, 242, 210]

[heroes]
